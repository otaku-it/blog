services:
  # 项目不再创建或管理 MySQL 容器，统一连接已有 MySQL。
  # 以下原始配置保留作参考，如以后确实需要独立数据库容器可取消注释。
  # mysql:
  #   image: mysql:8.4
  #   restart: unless-stopped
  #   environment:
  #     MYSQL_DATABASE: ${MYSQL_DATABASE:-blog}
  #     MYSQL_USER: ${MYSQL_USER:-blog}
  #     MYSQL_PASSWORD: ${MYSQL_PASSWORD:-blog_password}
  #     MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
  #   command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
  #   volumes:
  #     - mysql_data:/var/lib/mysql
  #   healthcheck:
  #     test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      # 默认 mysql 可继续连接当前网络中已存在的 MySQL；宿主机或远程数据库请在 .env 设置 MYSQL_HOST。
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-blog}:${MYSQL_PASSWORD:-blog_password}@${MYSQL_HOST:-mysql}:${MYSQL_PORT:-3306}/${MYSQL_DATABASE:-blog}?charset=utf8mb4
      ADMIN_USERNAME: ${ADMIN_USERNAME:-baize}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-now}
      AUTH_SECRET: ${AUTH_SECRET:-please-change-this-auth-secret}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    # Linux Docker 也可通过 host.docker.internal 访问宿主机已有 MySQL。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 已改用现有 MySQL，不再等待本项目内的 mysql 服务。
    # depends_on:
    #   mysql:
    #     condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${BLOG_PORT:-18080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  # 原 MySQL 数据卷定义保留但停用，项目不会再创建该数据卷。
  # mysql_data:
  uploads_data:
