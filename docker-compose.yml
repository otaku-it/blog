services:
  # 项目不再创建或管理 MySQL 容器，统一连接已有 MySQL。
  # 以下原始配置保留作参考，如以后确实需要独立数据库容器可取消注释。
  # mysql:
  #   image: mysql:8.4
  #   restart: unless-stopped
  #   environment:
  #     MYSQL_DATABASE: ${MYSQL_DATABASE:-blog}
  #     MYSQL_USER: ${MYSQL_USER:-blog}
  #     MYSQL_PASSWORD: ${MYSQL_PASSWORD:-blog_password}
  #     MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
  #   command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
  #   volumes:
  #     - mysql_data:/var/lib/mysql
  #   healthcheck:
  #     test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      # 云服务器已有 MySQL 通过宿主机映射端口访问；不依赖 Compose 内的 mysql 服务名。
      MYSQL_HOST: ${MYSQL_HOST:-host.docker.internal}
      # 云服务器上的 MySQL 默认使用 3306；本地若映射为 3308，请在 .env 覆盖。
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-blog}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root-lightship}
      # 如云平台直接提供完整连接串，可设置 DATABASE_URL 覆盖上面五项。
      DATABASE_URL: ${DATABASE_URL:-}
      DB_CONNECT_RETRIES: ${DB_CONNECT_RETRIES:-30}
      DB_CONNECT_INTERVAL: ${DB_CONNECT_INTERVAL:-2}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-baize}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-now}
      AUTH_SECRET: ${AUTH_SECRET:-please-change-this-auth-secret}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    # Linux Docker 也可通过 host.docker.internal 访问宿主机已有 MySQL。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 已改用现有 MySQL，不再等待本项目内的 mysql 服务。
    # depends_on:
    #   mysql:
    #     condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 60s

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${BLOG_PORT:-18080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  # 原 MySQL 数据卷定义保留但停用，项目不会再创建该数据卷。
  # mysql_data:
  uploads_data:
