const articleMarkdown=`<p class="text-xl !leading-9 text-zinc-600 dark:text-zinc-300">React Server Components（RSC）是近几年 React 生态里最容易被误解的概念之一。它不是 SSR 的新名字，也不是为了替代 Client Components，而是一次对“组件在哪里执行、数据在哪里获取”的重新划分。</p>
<h2 id="mental-model">01. 先建立正确的心智模型</h2><p>传统 React 应用里，组件代码主要在浏览器执行。即便使用 SSR，服务端也只是先生成一次 HTML，之后仍要把同一份组件 JavaScript 发送给浏览器完成 hydration。</p><blockquote>Server Component 的核心价值，是让一部分组件永远只在服务端执行，并且不进入客户端 JavaScript bundle。</blockquote><p>这带来三个直接变化：</p><ul><li>可以在组件中直接、安全地访问数据库或文件系统；</li><li>只把真正需要交互的组件发送到浏览器；</li><li>服务端与客户端组件可以组合，而不是二选一。</li></ul>
<h2 id="boundary">02. 边界：什么应该留在客户端</h2><p>一个简单判断原则：如果组件需要 <code>useState</code>、<code>useEffect</code> 或浏览器 API，它就属于客户端边界。其余展示与数据获取逻辑，通常可以留在服务端。</p><pre><code class="language-tsx">// app/articles/page.tsx — Server Component
export default async function ArticlesPage() {
  const articles = await db.article.findMany()
  return articles.map(article =&gt; (
    &lt;ArticleCard key={article.id} article={article} /&gt;
  ))
}</code></pre><p>这里没有额外的 API 层，也不会把数据库客户端暴露给浏览器。服务端组件的输出会以一种可流式传输的格式交给 React。</p>
<h2 id="composition">03. 组合，而不是全量迁移</h2><p>最好的迁移策略不是把所有组件改成 Server Component，而是从页面顶层向下识别交互边界。将搜索框、收藏按钮等小型交互岛标记为客户端组件。</p><pre><code class="language-tsx">'use client'
export function LikeButton({ initialCount }) {
  const [count, setCount] = useState(initialCount)
  return &lt;button onClick={() =&gt; setCount(v =&gt; v + 1)}&gt;
    {count} likes
  &lt;/button&gt;
}</code></pre>
<h2 id="data-flow">04. 数据流与缓存策略</h2><p>RSC 让数据请求靠近消费数据的组件，但这不代表可以忽视缓存。你仍然需要明确数据是静态的、按请求动态的，还是允许短时间复用。</p><ol><li><strong>静态内容</strong>：构建时生成，适合博客、文档。</li><li><strong>周期更新</strong>：设置 revalidate，适合商品与榜单。</li><li><strong>请求级动态</strong>：依赖 cookie、权限或实时状态。</li></ol>
<h2 id="pitfalls">05. 三个常见误区</h2><h3>误区一：RSC 会让所有应用更快</h3><p>它减少客户端 JavaScript，但服务端计算、网络往返和缓存失效仍然有成本。性能优化依然要回到真实指标。</p><h3>误区二：不再需要 API</h3><p>给第三方、移动端或公开平台使用的接口仍然需要。RSC 只是让同一个 Web 应用内部的数据读取不必机械地绕一层 HTTP。</p><h3>误区三：客户端状态已经过时</h3><p>拖拽、即时校验、乐观更新等交互仍然属于客户端。关键是缩小边界，而不是消灭边界。</p>
<h2 id="summary">06. 总结</h2><p>理解 RSC 的关键不是记 API，而是重新审视组件的运行位置。把数据获取和非交互渲染留在服务端，把必要的交互留给浏览器，你会得到更清晰的边界、更少的客户端代码，以及更直接的数据流。</p>`;

function Articles(){const tags=['全部',...new Set(posts.flatMap(p=>p.tags))];let f=posts.filter(p=>state.tag==='全部'||p.tags.includes(state.tag));if(state.query){const q=state.query.toLowerCase();f=f.filter(p=>(p.title+p.excerpt+p.tags.join('')).toLowerCase().includes(q))}const per=6,pages=Math.max(1,Math.ceil(f.length/per));state.page=Math.min(state.page,pages);const list=f.slice((state.page-1)*per,state.page*per);return `<main class="page-enter mx-auto max-w-7xl px-4 py-12 sm:px-6 lg:px-8"><p class="text-xs font-semibold uppercase tracking-[.18em] text-teal-700">Archive</p><h1 class="mt-2 text-4xl font-bold">文章归档</h1><p class="mt-3 text-zinc-500">关于技术、产品和独立开发的 ${posts.length} 篇记录。</p><div class="mt-10 flex flex-col gap-4 border-y border-zinc-200 py-5 dark:border-zinc-800 sm:flex-row sm:items-center"><div class="flex items-center gap-2 overflow-x-auto"><span class="shrink-0 text-sm font-medium">筛选</span>${tags.slice(0,10).map(t=>`<button onclick="setTag('${t}')" class="shrink-0 rounded-full px-3 py-1.5 text-xs font-medium ${state.tag===t?'bg-zinc-900 text-white dark:bg-white dark:text-zinc-950':'bg-zinc-100 text-zinc-600 dark:bg-zinc-900'}">${t}</button>`).join('')}</div><label class="relative ml-auto w-full sm:w-60"><span class="absolute inset-y-0 left-3 flex items-center text-zinc-400">${icon('Search')}</span><input value="${esc(state.query)}" oninput="searchArticles(this.value)" placeholder="在文章中搜索" class="h-9 w-full rounded-md border border-zinc-200 bg-transparent pl-9 pr-3 text-sm outline-none dark:border-zinc-800"></label></div><div class="mt-8 grid gap-4 md:grid-cols-2">${list.length?list.map(p=>Card(p,true)).join(''):`<div class="col-span-2 rounded-xl border border-dashed py-20 text-center"><p class="font-medium">没有找到匹配文章</p><button onclick="clearFilters()" class="mt-2 text-sm text-teal-700">清除筛选</button></div>`}</div>${list.length?`<div class="mt-10 flex flex-col items-center justify-between gap-4 border-t border-zinc-200 pt-6 dark:border-zinc-800 sm:flex-row function Tags(){const counts={};posts.forEach(p=>p.tags.forEach(t=>counts[t]=(counts[t]||0)+1));const sel=state.tag==='全部'?'React':state.tag,list=posts.filter(p=>p.tags.includes(sel));return `<main class="page-enter mx-auto max-w-7xl px-4 py-12 sm:px-6 lg:px-8"><p class="text-xs font-semibold uppercase tracking-[.18em] text-teal-700">Topics</p><h1 class="mt-2 text-4xl font-bold">标签</h1><p class="mt-3 text-zinc-500">循着关键词，找到感兴趣的内容。</p><div class="mt-10 grid gap-8 lg:grid-cols-[300px_1fr]"><aside><div class="grid grid-cols-2 gap-2 rounded-xl border border-zinc-200 p-3 dark:border-zinc-800">${Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([t,n])=>`<button onclick="selectTag('${t}')" class="rounded-lg border p-3 text-left ${sel===t?'border-teal-500 bg-teal-50 dark:bg-teal-950/40':'border-transparent bg-zinc-50 dark:bg-zinc-900'}"><div class="text-sm font-medium"># ${t}</div><div class="mt-1 text-xs text-zinc-400">${n} 篇文章</div></button>`).join('')}</div></aside><section><h2 class="text-2xl font-bold"># ${sel}</h2><p class="mt-1 text-sm text-zinc-500">${list.length} 篇相关文章</p><div class="mt-5 grid gap-4">${list.map(p=>Card(p,true)).join('')}</div></section></div></main>`}
function Categories(){const cats={};posts.forEach(p=>(cats[p.category]??=[]).push(p));const sel=state.category==='全部'?Object.keys(cats)[0]:state.category;return `<main class="page-enter mx-auto max-w-7xl px-4 py-12 sm:px-6 lg:px-8"><p class="text-xs font-semibold uppercase tracking-[.18em] text-teal-700">Collections</p><h1 class="mt-2 text-4xl font-bold">文章分类</h1><p class="mt-3 text-zinc-500">按知识领域整理的长期写作集合。</p><div class="mt-10 grid gap-8 lg:grid-cols-[280px_1fr]"><aside class="space-y-2">${Object.entries(cats).map(([c,l])=>`<button onclick="selectCategory('${c}')" class="flex w-full items-center rounded-lg border px-4 py-3 text-left ${sel===c?'border-zinc-900 bg-zinc-900 text-white dark:border-white dark:bg-white dark:text-zinc-950':'border-zinc-200 dark:border-zinc-800'}"><span class="flex h-8 w-8 items-center justify-center rounded-md bg-white/10">${icon('Folder')}</span><span class="ml-3 text-sm font-medium">${c}</span><span class="ml-auto text-xs opacity-60">${l.length}</span></button>`).join('')}</aside><section><h2 class="text-2xl font-bold">${sel}</h2><p class="mt-1 text-sm text-zinc-500">该分类下共 ${cats[sel].length} 篇文章</p><div class="mt-5 grid gap-4">${cats[sel].map(p=>Card(p,true)).join('')}</div></section></div></main>`}
function CommentSection(){return `<section class="mt-14 border-t border-zinc-200 pt-10 dark:border-zinc-800"><div class="flex items-center gap-2"><h2 class="text-xl font-bold">评论</h2><span class="rounded-full bg-zinc-100 px-2 py-0.5 text-xs text-zinc-500 dark:bg-zinc-800">${comments.length}</span></div><div class="mt-6 rounded-xl border border-zinc-200 p-4 dark:border-zinc-800"><textarea id="comment-input" rows="3" placeholder="友善交流，分享你的想法..." class="w-full resize-none bg-transparent text-sm outline-none"></textarea><div class="mt-3 flex items-center justify-between border-t pt-3 dark:border-zinc-800"><span class="text-xs text-zinc-400">Demo 评论仅保留在当前页面</span><button onclick="addComment()" class="flex h-8 items-center gap-1.5 rounded-md bg-zinc-900 px-3 text-xs font-medium text-white dark:bg-white dark:text-zinc-950">${icon('Send','h-3.5 w-3.5')} 发表评论</button></div></div><div id="comment-list" class="mt-7 space-y-6">${comments.map(c=>`<div class="flex gap-3"><div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-zinc-100 text-[10px] font-bold dark:bg-zinc-800">${c.initials}</div><div><div class="flex items-center gap-2"><span class="text-sm font-semibold">${c.name}</span><span class="text-xs text-zinc-400">${c.time}</span></div><p class="mt-1.5 text-sm leading-6 text-zinc-600 dark:text-zinc-400">${c.content}</p><button class="mt-2 text-xs text-zinc-400">回复</button></div></div>`).join('')}</div></section>`}
function Article(id){const p=posts.find(x=>x.id===id)||posts[0],idx=posts.indexOf(p),prev=posts[idx-1],next=posts[idx+1],toc=[['mental-model','01. 先建立正确的心智模型'],['boundary','02. 边界：什么应该留在客户端'],['composition','03. 组合，而不是全量迁移'],['data-flow','04. 数据流与缓存策略'],['pitfalls','05. 三个常见误区'],['summary','06. 总结']];return `<main class="page-enter"><section class="border-b border-zinc-200 bg-zinc-50/70 dark:border-zinc-800 dark:bg-zinc-900/25"><div class="mx-auto max-w-4xl px-4 py-12 text-center sm:py-16"><div class="text-sm text-zinc-500">文章 / ${p.category}</div><h1 class="mx-auto mt-5 max-w-3xl text-3xl font-black leading-tight tracking-[-.035em] sm:text-5xl">${p.title}</h1><p class="mx-auto mt-5 max-w-2xl leading-7 text-zinc-500">${p.excerpt}</p><div class="mt-7 flex flex-wrap items-center justify-center gap-4 text-sm text-zinc-500"><span class="flex items-center gap-2"><span class="flex h-7 w-7 items-center justify-center rounded-full bg-zinc-900 text-[10px] font-bold text-white dark:bg-white dark:text-zinc-950">LM</span>林默</span><span class="flex items-center gap-1">${icon('Calendar')} ${date(p.date)}</span><span class="flex items-center gap-1">${icon('Clock')} ${p.readTime}</span><span class="flex items-center gap-1">${icon('Eye')} ${p.views}</span></div><div class="mt-6 flex justify-center gap-2">${p.tags.map(Pill).join('')}</div></div></section><div class="mx-auto grid max-w-7xl gap-10 px-4 py-10 lg:grid-cols-[minmax(0,760px)_240px] lg:justify-center lg:py-14"><article class="min-w-0"><div class="prose-custom">${articleMarkdown}</div><div class="mt-12 rounded-xl border border-zinc-200 bg-zinc-50 p-5 dark:border-zinc-800 dark:bg-zinc-900/50"><div class="flex gap-4"><div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-full bg-zinc-900 font-bold text-white dark:bg-white dark:text-zinc-950">LM</div><div><h3 class="font-bold">林默 <span class="ml-1 rounded-full bg-teal-100 px-2 py-0.5 text-[10px] text-teal-700">作者</span></h3><p class="mt-1 text-sm leading-6 text-zinc-500">全栈工程师，关注现代 Web 开发、AI 工具与工程效率。相信好的技术内容应该让复杂变得清晰。</p></div></div></div><nav class="mt-8 grid gap-3 sm:grid-cols-2">${prev?`<button onclick="routeTo('/article/${prev.id}')" class="rounded-xl border p-4 text-left dark:border-zinc-800"><span class="text-xs text-zinc-400">← 上一篇</span><span class="mt-2 block text-sm font-semibold">${prev.title}</span></button>`:'<div></div>'}${next?`<button onclick="routeTo('/article/${next.id}')" class="rounded-xl border p-4 text-right dark:border-zinc-800"><span class="text-xs text-zinc-400">下一篇 →</span><span class="mt-2 block text-sm font-semibold">${next.title}</span></button>`:''}</nav>${CommentSection()}</article><aside class="hidden lg:block"><div class="sticky top-24"><p class="mb-3 text-xs font-semibold uppercase tracking-[.15em] text-zinc-400">本页目录</p><nav class="space-y-1 border-l border-zinc-200 dark:border-zinc-800">${toc.map(([id,t],i)=>`<button data-section="${id}" onclick="scrollToSection('${id}')" class="toc-link block w-full border-l border-transparent px-3 py-1.5 text-left text-xs leading-5 text-zinc-500 ${i===0?'active':''}">${t}</button>`).join('')}</nav><button onclick="copyLink()" class="mt-6 flex w-full items-center justify-center gap-2 rounded-md border py-2 text-xs text-zinc-500 dark:border-zinc-800">${icon('Link')} 复制文章链接</button></div></aside></div></main>`}
function About(){const groups=[['前端',['TypeScript','React / Next.js','Vue','Tailwind CSS']],['后端',['Node.js','Go','PostgreSQL','Redis']],['工程',['Docker','CI/CD','可观测性','系统设计']]];return `<main class="page-enter"><section class="border-b border-zinc-200 dark:border-zinc-800"><div class="mx-auto grid max-w-5xl gap-10 px-4 py-14 md:grid-cols-[220px_1fr] lg:py-20"><div><div class="flex aspect-square max-w-[200px] items-end rounded-2xl bg-gradient-to-br from-zinc-100 to-zinc-300 p-5 dark:from-zinc-800 dark:to-zinc-900"><div class="text-6xl font-black text-zinc-400/70">LM.</div></div><div class="mt-4 flex items-center gap-2 text-sm text-zinc-500">${icon('MapPin')} 中国 · 上海</div></div><div><p class="text-xs font-semibold uppercase tracking-[.18em] text-teal-700">About me</p><h1 class="mt-2 text-5xl font-black tracking-tight">你好，我是林默。</h1><p class="mt-6 text-lg leading-8 text-zinc-600 dark:text-zinc-300">一名有产品思维的全栈工程师，也是一个长期主义的技术写作者。</p><div class="mt-5 space-y-4 text-[15px] leading-7 text-zinc-500"><p>过去 8 年，我参与过从 0 到 1 的创业产品，也维护过服务数百万用户的前端系统。目前专注于开发者工具与 AI 应用方向。</p><p>我喜欢研究复杂系统背后的简单原则，也享受把模糊的想法变成清晰、可用的产品。这个博客是我的公开笔记。</p></div><div class="mt-7 flex gap-3"><a href="https://github.com" target="_blank" class="inline-flex h-9 items-center gap-2 rounded-md bg-zinc-900 px-3.5 text-sm font-medium text-white dark:bg-white dark:text-zinc-950">${icon('Github')} GitHub</a><a href="mailto:hello@example.com" class="inline-flex h-9 items-center gap-2 rounded-md border px-3.5 text-sm font-medium dark:border-zinc-800">${icon('Mail')} 联系我</a></div></div></div></section><section class="mx-auto max-w-5xl px-4 py-14"><div class="grid gap-12 md:grid-cols-[1fr_1.2fr]"><div><p class="text-xs font-semibold uppercase tracking-[.18em] text-teal-700">Principles</p><h2 class="mt-2 text-2xl font-bold">我在意的事情</h2><div class="mt-6 space-y-5">${[['01','清晰胜过聪明','让代码、界面与表达都尽可能容易理解。'],['02','系统胜过意志','用可重复的流程解决问题，而不是依赖临场发挥。'],['03','交付胜过想象','真实用户的反馈，永远比完美设想更有价值。']].map(([n,t,d])=>`<div class="flex gap-4"><span class="text-xs font-bold text-teal-600">${n}</span><div><h3 class="text-sm font-semibold">${t}</h3><p class="mt-1 text-sm leading-6 text-zinc-500">${d}</p></div></div>`).join('')}</div></div><div><p class="text-xs font-semibold uppercase tracking-[.18em] text-teal-700">Stack</p><h2 class="mt-2 text-2xl font-bold">技术栈</h2><div class="mt-6 space-y-3">${groups.map(([g,a],i)=>`<div class="rounded-xl border p-4 dark:border-zinc-800"><div class="flex items-center gap-2 text-sm font-semibold">${icon(i===0?'Code':i===1?'Server':'Terminal')} ${g}</div><div class="mt-3 flex flex-wrap gap-2">${a.map(s=>`<span class="rounded-md bg-zinc-100 px-2.5 py-1 text-xs dark:bg-zinc-800">${s}</span>`).join('')}</div></div>`).join('')}</div></div></div></section></main>`}
function Write(){return `<main class="page-enter min-h-[calc(100vh-4rem)] bg-zinc-50 dark:bg-zinc-950"><div class="border-b bg-white dark:border-zinc-800 dark:bg-zinc-950"><div class="mx-auto flex max-w-[1500px] items-center gap-3 px-4 py-3"><div><div class="flex items-center gap-2 text-sm font-semibold">${icon('File')} 新建文章</div><p class="text-xs text-zinc-400">草稿 · 本地 Demo</p></div><div class="ml-auto flex gap-2"><button onclick="saveDraft()" class="h-9 rounded-md border px-3 text-sm dark:border-zinc-800">保存草稿</button><button onclick="publishDemo()" class="flex h-9 items-center gap-2 rounded-md bg-teal-600 px-4 text-sm font-medium text-white">${icon('Send')} 发布文章</button></div></div></div><div class="mx-auto max-w-[1500px] p-4 sm:p-6"><div class="mb-4 grid gap-4 lg:grid-cols-[1fr_380px]"><div class="rounded-xl border bg-white p-4 dark:border-zinc-800 dark:bg-zinc-900"><label class="text-xs text-zinc-500">文章标题</label><input id="editor-title" value="为什么我开始重新思考前端架构" class="mt-1.5 w-full bg-transparent text-xl font-bold outline-none"></div><div class="rounded-xl border bg-white p-4 dark:border-zinc-800 dark:bg-zinc-900"><label class="text-xs text-zinc-500">文章标签</label><div class="mt-2 flex flex-wrap items-center gap-2">${state.editorTags.map(t=>`<span class="rounded-full bg-zinc-100 px-2.5 py-1 text-xs dark:bg-zinc-800">${t}<button onclick="removeTag('${t}')" class="ml-1 text-zinc-400">×</button></span>`).join('')}<input id="tag-input" onkeydown="addTag(event)" class="min-w-[100px] flex-1 bg-transparent text-xs outline-none" placeholder="输入后回车"></div></div></div><div class="grid min-h-[640px] overflow-hidden rounded-xl border bg-white dark:border-zinc-800 dark:bg-zinc-900 lg:grid-cols-2"><section class="flex min-h-[500px] flex-col border-b dark:border-zinc-800 lg:border-b-0 lg:border-r"><div class="flex h-11 items-center border-b px-4 text-xs font-semibold text-zinc-500 dark:border-zinc-800">${icon('Code','h-3.5 w-3.5')} &nbsp;MARKDOWN</div><textarea id="markdown-editor" oninput="updatePreview(this.value)" onkeydown="handleTab(event)" spellcheck="false" class="flex-1 resize-none bg-transparent p-5 font-mono text-sm leading-7 outline-none">${esc(state.editorValue)}</textarea></section><section class="min-h-[500px]"><div class="flex h-11 items-center border-b px-4 text-xs font-semibold text-zinc-500 dark:border-zinc-800">${icon('Eye','h-3.5 w-3.5')} &nbsp;实时预览<span class="ml-auto flex items-center gap-1 text-[10px] text-teal-600">${icon('Sparkles','h-3 w-3')} LIVE</span></div><div id="markdown-preview" class="editor-preview p-5 text-sm text-zinc-700 dark:text-zinc-300"></div></section></div></div></main>`}
function render(){state.route=location.hash.slice(1)||'/';let p;if(state.route==='/')p=Home();else if(state.route==='/articles')p=Articles();else if(state.route==='/tags')p=Tags();else if(state.route==='/categories')p=Categories();else if(state.route==='/about')p=About();else if(state.route==='/write')p=Write();else if(state.route.startsWith('/article/'))p=Article(state.route.split('/').pop());else p='<main class="grid min-h-[70vh] place-items-center"><button onclick="routeTo(\'/\')">404 · 返回首页</button></main>';document.getElementById('app').innerHTML=Header()+p+Footer();lucide.createIcons();if(state.route==='/write')updatePreview(state.editorValue);if(state.route.startsWith('/article/')){document.querySelectorAll('pre code').forEach(e=>hljs.highlightElement(e));setTimeout(setupToc,50)}}function renderHeaderOnly(){const h=document.getElementById('site-header');if(h){h.outerHTML=Header();lucide.createIcons()}}
function filterByTag(t){state.tag=t;routeTo('/tags')}function setTag(t){state.tag=t;state.page=1;render()}function selectTag(t){state.tag=t;render()}function selectCategory(c){state.category=c;render()}function setPage(n){if(n<1)return;state.page=n;render();scrollTo({top:0,behavior:'smooth'})}function searchArticles(v){state.query=v;state.page=1;render();setTimeout(()=>{const i=document.querySelector('main input');if(i){i.focus();i.setSelectionRange(v.length,v.length)}},0)}function clearFilters(){state.tag='全部';state.query='';render()}function navSearch(e){if(e.key==='Enter'){state.query=e.target.value.trim();state.tag='全部';routeTo('/articles')}}function scrollToSection(id){document.getElementById(id)?.scrollIntoView({behavior:'smooth'})}function setupToc(){const l=[...document.querySelectorAll('.toc-link')];const o=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)l.forEach(x=>x.classList.toggle('active',x.dataset.section===e.target.id))}),{rootMargin:'-90px 0px -65% 0px'});l.forEach(x=>{const s=document.getElementById(x.dataset.section);if(s)o.observe(s)})}function copyLink(){navigator.clipboard?.writeText(location.href);toast('链接已复制')}function subscribe(){const i=document.getElementById('newsletter-email');if(!i.value.includes('@'))return toast('请输入有效邮箱');i.value='';toast('订阅成功，欢迎加入')}function addComment(){const i=document.getElementById('comment-input'),v=i.value.trim();if(!v)return toast('先写点内容吧');comments.unshift({name:'访客',time:'刚刚',content:v,initials:'ME'});render();toast('评论已添加（Demo）')}function updatePreview(v){state.editorValue=v;const e=document.getElementById('markdown-preview');if(!e)return;marked.setOptions({breaks:true,gfm:true});e.innerHTML=marked.parse(v);e.querySelectorAll('pre code').forEach(x=>hljs.highlightElement(x))}function handleTab(e){if(e.key==='Tab'){e.preventDefault();const t=e.target,s=t.selectionStart;t.value=t.value.slice(0,s)+'  '+t.value.slice(t.selectionEnd);t.selectionStart=t.selectionEnd=s+2;updatePreview(t.value)}}function addTag(e){if(e.key==='Enter'&&e.target.value.trim()){e.preventDefault();const t=e.target.value.trim();if(!state.editorTags.includes(t)&&state.editorTags.length<5)state.editorTags.push(t);render();setTimeout(()=>document.getElementById('tag-input')?.focus(),0)}}function removeTag(t){state.editorTags=state.editorTags.filter(x=>x!==t);render()}function saveDraft(){toast('草稿已暂存（Demo）')}function publishDemo(){if(!document.getElementById('editor-title').value.trim())return toast('请先填写文章标题');toast('发布成功！这是一个原型演示')}function toast(m){document.getElementById('toast')?.remove();const e=document.createElement('div');e.id='toast';e.className='fixed bottom-5 left-1/2 z-[100] -translate-x-1/2 rounded-lg bg-zinc-900 px-4 py-3 text-sm font-medium text-white shadow-xl dark:bg-white dark:text-zinc-950';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
addEventListener('hashchange',()=>{state.mobileOpen=false;render();scrollTo({top:0})});addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.getElementById('nav-search')?.focus()}});initTheme();render();
</script></body></html>
